  const key=sessionKey();

    // Older drafts have no stage metadata. Preserve them without guessing a category.
    s.stageDrafts=emptyStageDrafts();s.legacyText=s.draft||'';
    s.activeStage=s.legacyText?'legacy':'片头';s.savedStageDrafts={};
    if(s.savedAt&&s.legacyText.trim())s.savedStageDrafts.legacy={text:s.legacyText,time:s.savedAt,version:s.version};

function primaryAction(){const s=session();if(s.final){viewVersion('final');return}if(s.flow==='later'&&!s.initial){if(s.videoStatus!=='ready'||!s.draft.trim())return;flushDraft();showModal('确认初稿，查看 AI 反馈',`<p>当前正文将固定为你的<strong>已确认初稿</strong>，用于保留接触 AI 反馈前的教学判断。确认后，你仍可继续编辑正文。</p><div class="snapshot">${esc(s.draft)}</div><div class="snapshot-meta">${s.draft.replace(/\s/g,'').length} 字 · 初稿只确认一次</div><div class="review-note">AI 将分析同一标准视频。示例中初稿仅用于版本留存，不作为模型输入。</div>`,`<button class="btn" data-action="closeModal">继续修改</button><button class="btn primary" data-action="confirmInitial">确认初稿并生成反馈</button>`);return}if(!canSubmit()){toast(submitReason());return}flushDraft();showModal('提交本轮最终反思',`<p>提交后将保存当前正文的最终稿快照，并结束本轮任务。请确认你的观察、依据与改进想法已记录完整。</p><div class="snapshot">${esc(s.draft)}</div><div class="snapshot-meta">${s.draft.replace(/\s/g,'').length} 字 · 任务 ${s.id}</div>`,`<button class="btn" data-action="closeModal">返回检查</button><button class="btn primary" data-action="confirmFinal">确认提交</button>`)}
function confirmInitial(){const s=session();if(s.initial||s.final)return;if(offline){toast('请先恢复模拟连接，草稿已保留在本机');return}flushDraft();s.initial=reflectionSnapshot(s);record('初稿确认','固定一份初稿快照');closeModal();startAI();updateWorkspaceState()}

function history(){
  const s=session();
  const block=(title,record,submitted=false)=>`<div class="archive-version"><div class="archive-version-head"><h3>${title}</h3>${record?`<span class="archive-time">${localTime(record.time)}</span>`:''}</div>${record?`<div class="archive-text">${esc(record.text)}</div>`:`<p class="archive-empty">${submitted?'暂无已提交的反思内容':'暂无已保存的反思草稿'}</p>`}</div>`;
  const section=(stage,label=stage)=>{
    const draft=s.savedStageDrafts[stage];
    const finalText=stage==='legacy'?(s.final?.legacyText||(!s.final?.stages?s.final?.text:'')):s.final?.stages?.[stage];
    const final=finalText?.trim()?{text:finalText,time:s.final.time}:null;
    return `<section class="card archive-stage" aria-label="${label}反思记录"><h2>${label}</h2><div class="archive-versions">${block('已保存草稿',draft)}${block('已提交反思',final,true)}</div></section>`;
  };
  const hasLegacy=s.savedStageDrafts.legacy||s.final?.legacyText?.trim()||(!s.final?.stages&&s.final?.text?.trim());
  return `<div class="page-head"><h1>反思记录</h1></div><div class="reflection-archive">${reflectionStages.map(stage=>section(stage)).join('')}${hasLegacy?section('legacy','历史正文（未标注阶段）'):''}</div>`;
}

function saveConfig(){
  const next=Object.fromEntries(rounds.map(r=>[r.id,groupsForRound(r.id).map(g=>({...g,flow:$(`#flow-${r.id}-${g.id}`).value,scaffold:document.querySelector(`.scaffold-config[data-round="${r.id}"][data-group="${g.id}"]`).checked}))]));
  let retained=0;
  for(const r of rounds)for(const g of next[r.id]){
    const key=sessionKey(g.id,r.id),s=store.sessions[key];
    if(s&&(s.draft.trim()||s.initial||s.final||s.aiPresentedAt)){retained++;continue}
    if(s){store.sessions[key]=newSession(g,r.id);store.sessions[key].configVersion=store.configVersion+1}
  }
  store.roundGroups=next;store.groups=next['1'];store.configVersion++;persist();render();
  toast(`两轮配置已保存为 v${store.configVersion}${retained?'；已有作业的任务继续使用原配置':''}`);
}

function beginUpload(file=null,fail=false){const s=session();if(s.final)return;if(uploadTimer&&processingTaskId!==s.id){toast('另一个演示任务的视频正在处理，请稍候再开始新的上传');return}processingTaskId=s.id;if(s.initial||s.aiPresentedAt||s.aiRequestedAt&&s.flow==='later'){showModal('当前视频已关联反馈',`<p>本任务的视频已关联初稿或 AI 反馈。为保持素材一致，此原型不在当前任务中替换视频。可在“异常与状态演示”中选择重置当前任务，再从视频上传开始体验。</p>`,`<button class="btn primary" data-action="closeModal">知道了</button>`);return}stopPlayback();clearInterval(uploadTimer);clearTimeout(aiTimers.get(s.id));if(videoUrl){URL.revokeObjectURL(videoUrl);videoUrl=null}videoFile=file;s.videoName=file?.name||'示例微课_重新上传.mp4';s.videoLocal=!!file;s.videoStatus='uploading';s.aiStatus=s.flow==='first'?'generating':'locked';s.aiGeneratedAt=null;s.aiPresentedAt=null;s.aiRequestedAt=null;uploadStage='uploading';uploadProgress=0;record('上传开始',file?'本地选择文件，未上传服务器':'使用示例文件模拟上传');if(file)videoUrl=URL.createObjectURL(file);showModal('视频处理中',`<p>${esc(s.videoName)}</p><div id="uploadStatus"></div><div class="review-note">你可以关闭弹窗继续写作。上传、校验和转码均为本地状态模拟。</div>`,`<button class="btn" data-action="closeModal">继续编辑反思</button>`);updateVideoStatus();uploadTimer=setInterval(()=>{uploadProgress+=10;if(uploadProgress===50){uploadStage='transcoding';s.videoStatus='transcoding';record('上传校验通过','模拟文件可读与视频轨检查',s)}if(uploadProgress>=100){clearInterval(uploadTimer);uploadTimer=null;uploadStage=fail?'failed':'ready';s.videoStatus=fail?'failed':'ready';if(fail){record('转码失败','模拟临时处理错误',s)}else{s.videoId=`V-${s.group}-017-${Date.now()}`;s.standardId=`STD-${s.group}-017-${Date.now()}`;record('标准视频就绪','MP4 / H.264 / AAC 为目标配置，原型未执行真实转码',s);if(s.flow==='first'){s.aiRequestedAt=now();startAIForSession(s)}}persist();updateVideoStatus();if($('#uploadStatus'))$('#uploadStatus').innerHTML=fail?`<div class="notice" style="margin-top:18px">处理失败，草稿已保留。请关闭弹窗后重试转码。</div>`:`<div class="notice green" style="margin-top:18px">${icons('check')} 标准视频处理完成（模拟）。可返回工作台继续反思。</div>`;if(page==='workspace'&&s===session()){const text=$('#reflection')?.value;flushDraft();render();if(text!==undefined)$('#reflection').value=text;}return}if($('#uploadStatus'))$('#uploadStatus').innerHTML=`<div class="progress"><div style="width:${uploadProgress}%"></div></div><div class="progress-status">${uploadStage==='uploading'?'模拟上传与校验':'模拟后台统一转码'} · ${uploadProgress}%</div>`;updateVideoStatus()},320)}
function updateVideoStatus(){const s=session();if($('#videoStatusBadge')){$('#videoStatusBadge').className='tag '+(s.videoStatus==='ready'?'green':s.videoStatus==='failed'?'red':'amber');$('#videoStatusBadge').textContent=videoStatusLabel(s);$('#videoName').textContent=s.videoName;$('#processingInline').innerHTML=s.videoStatus==='ready'?'':`<div class="notice" style="margin:0 14px 14px;font-size:10px">${icons(s.videoStatus==='failed'||s.videoStatus==='empty'?'info':'reset',s.videoStatus==='failed'||s.videoStatus==='empty'?'':'spin')}<span>${s.videoStatus==='failed'?'视频处理失败。草稿仍可编辑。':s.videoStatus==='empty'?'请选择微课视频，反思框仍可编辑。':'正在处理视频，反思框始终可编辑。'}</span>${s.videoStatus==='failed'?'<button class="version-link" style="margin-left:auto" data-action="retryVideo">重试</button>':''}</div>`;updateWorkspaceState()}persist()}
function scenarios(){showModal('异常与状态演示',`<p>用于需求讨论的本地模拟，不调用后端服务。切换状态时保留当前正文；重置操作会单独确认。</p><div class="scenario-options"><button class="scenario" data-action="scenario" data-scenario="offline"><strong>${offline?'恢复模拟连接':'模拟短时断网'}</strong><small>编辑本机保留，恢复后同步记录</small></button><button class="scenario" data-action="scenario" data-scenario="videoFail"><strong>模拟转码失败</strong><small>保留草稿，提供对应环节重试</small></button><button class="scenario" data-action="scenario" data-scenario="aiFail"><strong>模拟 AI 分析失败</strong><small>允许继续编辑，重试沿用视频</small></button><button class="scenario" data-action="scenario" data-scenario="aiDelay"><strong>模拟 AI 先介入延迟</strong><small>切至本轮 AI 先介入班级，15 秒后呈现反馈</small></button><button class="scenario" data-action="scenario" data-scenario="reload"><strong>刷新恢复演示</strong><small>保留草稿、版本与已显示反馈</small></button><button class="scenario" data-action="scenario" data-scenario="reset"><strong>重置当前演示任务</strong><small>清除当前班级本轮记录，重新体验流程</small></button></div><div class="review-note">实际的服务端权限、版本并发、防重复、媒体处理与断网补传机制，需要后续接口实现和联调验证。</div>`)}
function runScenario(type){if(type==='reset'){showModal('重置当前演示任务',`<p>仅清除本浏览器中 ${className(groupId)}在${roundTitle(roundId)}中的演示任务的草稿、快照与过程记录。其他班级、轮次以及原始 Word 文件不受影响。</p>`,`<button class="btn" data-action="closeModal">取消</button><button class="btn" data-action="resetEmpty">从视频上传开始</button><button class="btn primary" data-action="resetCurrent">使用示例重新开始</button>`);return}if(type==='reload'){flushDraft();record('重新进入工作台','本地恢复演示');closeModal();stopPlayback();render();toast('已从本机记录恢复任务阶段、草稿与可见反馈');return}if(type==='offline'){offline=!offline;if(!offline){for(const s of Object.values(store.sessions)){s.pendingSync=false;for(const e of s.events)if(!e.receivedAt)e.receivedAt=now()}record('模拟连接恢复','保留事件原序号、发生时间与正文版本')}else record('模拟断网','继续本机保留草稿');persist();closeModal();if(page==='workspace'){$('#saveStatus').innerHTML=saveLabel();updateWorkspaceState()}toast(offline?'已模拟断网；继续输入，草稿会保留在本机':'模拟连接已恢复，待同步记录已标记接收');return}if(session().final&&type!=='aiDelay'){toast('请先重置当前演示任务，再体验异常流程');return}if(type==='videoFail'){closeModal();session().videoStatus='failed';record('转码失败','模拟临时错误，允许重试');if(role!=='student'){role='student';page='workspace';render()}updateVideoStatus();toast('已模拟处理失败，反思正文仍可编辑');return}if(type==='aiFail'){const s=session();if(s.flow==='none'){toast('无 AI 流程已禁用 AI 调用与结果读取，请切换至本轮已启用 AI 的班级');return}if(s.flow==='later'&&!s.initial){toast('请先在工作台确认初稿，再模拟 AI 失败');return}closeModal();clearTimeout(aiTimers.get(s.id));s.aiStatus='failed';record('AI 分析失败','模拟分析超时');if(role!=='student'||page!=='workspace'){role='student';page='workspace';render()}else $('#aiArea').innerHTML=aiPanel();updateWorkspaceState();return}if(type==='aiDelay'){const d=groupsForRound().find(g=>g.flow==='first');if(!d){toast('请先在实验配置中分配一个 AI 先介入组');return}const ds=store.sessions[sessionKey(d.id)];if(ds&&(ds.draft||ds.initial||ds.final||ds.aiPresentedAt)){showModal('重新演示 AI 反馈延迟',`<p>${className(d.id)}在${roundTitle(roundId)}中已有演示记录。重新开始将清除该班当前轮次的本地正文、快照与过程记录，并在进入工作台 15 秒后显示反馈。其他班级和轮次不受影响。</p>`,`<button class="btn" data-action="closeModal">保留原记录</button><button class="btn primary" data-action="confirmDelay" data-group="${d.id}">重新开始并演示</button>`);return}startDelayedPreview(d.id);return}}
function startDelayedPreview(id){flushDraft();stopPlayback();closeModal();clearTimeout(aiTimers.get(store.sessions[sessionKey(id)]?.id));if(videoUrl){URL.revokeObjectURL(videoUrl);videoUrl=null}groupId=id;store.sessions[sessionKey(id)]=newSession(group());const s=session();s.aiStatus='generating';s.aiRequestedAt=null;s.aiGeneratedAt=null;role='student';page='workspace';render();record('进入工作台','AI 先介入延迟演示');startAI(15000);toast('反馈延迟 15 秒。此时可输入，首次呈现时将记录实际顺序')}
function resetCurrent(empty=false){clearTimeout(aiTimers.get(session().id));clearInterval(uploadTimer);uploadStage='idle';flushDraft();stopPlayback();if(videoUrl){URL.revokeObjectURL(videoUrl);videoUrl=null}delete store.sessions[sessionKey()];const resetSession=session();if(empty){resetSession.videoStatus='empty';resetSession.videoName='尚未上传微课视频';resetSession.videoId=null;resetSession.standardId=null;resetSession.aiStatus='locked';resetSession.aiRequestedAt=null;resetSession.aiGeneratedAt=null}record('进入工作台','当前组演示已重新开始');closeModal();persist();role='student';page='workspace';render();toast(`${className(groupId)} · ${roundTitle(roundId)}演示已重置`)}
function download(name,content,type='text/plain;charset=utf-8'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csv(columns,rows){return '\ufeff'+[columns,...rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportData(){flushDraft();const list=selectedSessions();if(!list.length){toast('没有可导出的任务');return}const taskRows=list.map(s=>[s.id,s.participant,s.group,className(s.group),s.round,s.flow,s.scaffold,s.configVersion,'scaffold-v0.1','prompt-v0.1',s.videoId,s.standardId,s.videoStatus,s.openedAt,s.enteredAt,s.orderDeviation,s.final?'submitted':'draft']);const textRows=list.flatMap(s=>[['draft',s.draft,s.version,s.savedAt],...(s.initial?[['initial',s.initial.text,s.initial.version,s.initial.time]]:[]),...(s.final?[['final',s.final.text,s.final.version,s.final.time]]:[])].map(([v,t,n,time])=>[s.id,s.participant,v,t,n,time]));const feedbackRows=list.filter(s=>s.flow!=='none'&&s.aiRequestedAt).map(s=>[s.id,`AI-${s.group}-${s.roundId}-017`,s.aiStatus,'demo-model','prompt-v0.1','feedback-v0.1',s.aiRequestedAt,s.aiGeneratedAt,s.aiPresentedAt,s.aiStatus==='ready'?feedbackRecords().map(f=>`[${fmt(f.time)}] ${f.title}\n${f.observation}\n建议：${f.suggestion}`).join('\n\n'):'']);const eventRows=list.flatMap(s=>s.events.map(e=>[s.id,s.participant,e.seq,e.type,e.time,e.receivedAt,e.position,e.detail,e.offline]));showModal('导出本地演示数据',`<p>共 ${list.length} 个任务实例。分表 CSV 均为 UTF-8 编码，可按 task_id 关联。为便于浏览器逐个下载，请选择下列文件。</p><div class="scenario-options">${[['tasks','任务记录','实验条件、视频与配置'],['texts','文本版本','草稿、初稿与最终稿原文'],['feedback','AI 反馈','生成与首次呈现时间'],['events','行为事件','事件顺序、时间与视频位置']].map(([id,t,d])=>`<button class="scenario" data-action="downloadCSV" data-kind="${id}"><strong>${icons('download','i-sm').replace('class="icon i-sm"','class="icon i-sm" style="display:inline-block;vertical-align:middle;margin-right:5px"')} ${t}.csv</strong><small>${d}</small></button>`).join('')}</div><div class="review-note">文件内容为本地原型演示数据。尚未连接真实参与者、服务端存储或 AI 服务。</div>`,'',true);window.exportFiles={tasks:csv(['task_id','participant_id','group','class_name','round','flow','scaffold','config_version','scaffold_version','prompt_version','video_id','standard_video_id','video_status','opened_at','entered_at','order_deviation','task_status'],taskRows),texts:csv(['task_id','participant_id','text_type','original_text','version','saved_at'],textRows),feedback:csv(['task_id','feedback_id','status','model','prompt_version','template_version','requested_at','generated_at','first_presented_at','feedback_text'],feedbackRows),events:csv(['task_id','participant_id','seq','event','occurred_at','received_at_simulated','video_seconds','detail','occurred_offline'],eventRows)}}
function inspectTask(g,round=roundId){const s=store.sessions[sessionKey(g,round)];showModal('任务实例详情',`<div class="setting-row"><span>任务 / 参与者</span><strong>${s.id} / ${s.participant}</strong></div><div class="setting-row"><span>班级 / 轮次</span><strong>${className(s.group)} / ${s.round}</strong></div><div class="setting-row"><span>流程 / 支架</span><strong>${flowNames[s.flow]} / ${s.scaffold?'开启':'关闭'}</strong></div><div class="setting-row"><span>标准视频 ID</span><strong>${s.standardId}</strong></div><div class="setting-row"><span>首次非空输入</span><strong>${localTime(s.firstInputAt)}</strong></div><div class="setting-row"><span>初稿确认</span><strong>${localTime(s.initial?.time)}</strong></div><div class="setting-row"><span>反馈生成完成</span><strong>${localTime(s.aiGeneratedAt)}</strong></div><div class="setting-row"><span>反馈首次呈现</span><strong>${localTime(s.aiPresentedAt)}</strong></div><div class="setting-row"><span>顺序偏离</span><strong>${s.orderDeviation?'已记录':'无已记录偏离'}</strong></div><div class="review-note">事件时间来自本机；原型不能验证服务端时钟、真实权限与并发机制。</div>`,`<button class="btn primary" data-action="closeModal">关闭</button>`)}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;switch(a){case'navigate':closeModal();navigate(b.dataset.page);break;case'role':switchRole(b.dataset.role);break;case'closeModal':closeModal();break;case'mobileNav':showModal('页面导航',`<div class="nav">${navItems[role].map(([p,i,t])=>`<button data-action="navigate" data-page="${p}">${icons(i)}${t}</button>`).join('')}</div>`);break;case'prompt':switchReflectionStage(b.dataset.stage);break;case'play':await togglePlayback();break;case'seekTo':seekTo(Number(b.dataset.time));break;case'timestamp':insertTime();break;case'saveDraft':saveDraft(true);break;case'primary':primaryAction();break;case'confirmInitial':confirmInitial();break;case'confirmFinal':confirmFinal();break;case'finishSubmit':closeModal();break;case'viewVersion':viewVersion(b.dataset.version);break;case'downloadVersion':{const s=session(),v=b.dataset.version,obj=v==='draft'?{text:s.draft}:s[v];if(obj)download(`${s.id}-${v}.txt`,obj.text);break}case'volume':{const v=$('#localVideo');if(v){v.muted=!v.muted;toast(v.muted?'视频已静音':'视频声音已开启')}else toast('当前示例画面无音轨，选择本地视频后可控制声音');break}case'fullscreen':try{await $('#videoStage').requestFullscreen()}catch(err){toast('当前浏览器不支持全屏，请扩大窗口查看')}break;case'upload':openUpload();break;case'chooseFile':$('#fileInput').value='';$('#fileInput').click();break;case'demoUpload':beginUpload();break;case'retryVideo':{const s=session();s.videoStatus='transcoding';uploadStage='transcoding';record('转码重试','复用同一视频素材');updateVideoStatus();setTimeout(()=>{s.videoStatus='ready';uploadStage='ready';record('标准视频就绪','模拟重试完成',s);if(s===session()){updateVideoStatus();if(s.flow==='first'&&!s.aiPresentedAt)startAI()}},1800);break}case'retryAI':if(session().videoStatus!=='ready')toast('请先等待标准视频就绪');else startAI();break;case'scenarios':flushDraft();scenarios();break;case'scenario':runScenario(b.dataset.scenario);break;case'resetCurrent':resetCurrent();break;case'resetEmpty':resetCurrent(true);openUpload();break;case'confirmDelay':startDelayedPreview(b.dataset.group);break;case'saveConfig':saveConfig();break;case'previewConfig':{const id=b.dataset.group,round=b.dataset.round,g=groupsForRound(round).find(x=>x.id===id);const unsaved=$(`#flow-${round}-${id}`).value!==g.flow||document.querySelector(`.scaffold-config[data-round="${round}"][data-group="${id}"]`).checked!==g.scaffold;if(unsaved){toast('请先保存实验配置，再预览更改后的条件');break}flushDraft();stopPlayback();if(videoUrl){URL.revokeObjectURL(videoUrl);videoUrl=null}roundId=round;groupId=id;role='student';page='workspace';render();record('进入工作台','研究端预览');break}case'dataTab':dataTab=b.dataset.tab;render();break;case'exportData':exportData();break;case'downloadCSV':if(window.exportFiles?.[b.dataset.kind]){download(`微课反思-${b.dataset.kind}.csv`,window.exportFiles[b.dataset.kind],'text/csv;charset=utf-8');toast('CSV 下载已准备')}break;case'inspectTask':inspectTask(b.dataset.group,b.dataset.round);break;case'researchVersion':{const original=groupId,originalRound=roundId;groupId=b.dataset.group;roundId=b.dataset.round;viewVersion(b.dataset.version);groupId=original;roundId=originalRound;$('#modalRoot [data-action="downloadVersion"]')?.remove();break}}});
$('#previewGroup').addEventListener('change',e=>changePreview(roundId,e.target.value));
$('#previewRound').addEventListener('change',e=>changePreview(e.target.value,groupId));
$('#fileInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(f.size===0){toast('所选文件为空，请重新选择视频');return}if(!f.type.startsWith('video/')&&!/\.(mp4|mov|webm|mkv|avi|m4v)$/i.test(f.name)){toast('请选择视频文件');return}beginUpload(f)});
document.addEventListener('change',e=>{if(e.target.id==='dataGroup'){dataFilter=e.target.value;render()}if(e.target.id==='dataRound'){dataRoundFilter=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modalRoot').children.length)closeModal();if(e.key==='Tab'&&$('#modalRoot').children.length){const items=[...document.querySelectorAll('#modalRoot button:not(:disabled),#modalRoot input,#modalRoot textarea,#modalRoot select')].filter(el=>el.offsetParent!==null),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener('beforeunload',()=>{flushDraft();persist()});
for(const s of Object.values(store.sessions)){if(['uploading','transcoding'].includes(s.videoStatus)){s.videoStatus='failed';record('处理状态需恢复','刷新后本地模拟任务需手动重试',s)}if(s.aiStatus==='generating'){s.aiStatus='failed';record('AI 分析需重试','刷新后可沿用原状态重试',s)}}
session();record('进入工作台','需求确认原型');render();
</script>
</body>
</html>
